<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel — Flat Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  :root{
    --panel: #2b2a31;
    --panel-controls: #2f2e36;
    --track: #55545e;
    --fill: #e7e6ea;
    --icon: #d8d7dd;
    --icon-dim: #8b8a94;
    --accent: #7c8cff;
  }

  body{
    background: #17161a;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    padding: 0;
    margin: 0;
    overflow: hidden;
  }

  .stage{ width:100%; height:100vh; max-width: 100vw; }

  .player{
    position:relative;
    width:100%;
    height: 100vh;
    background: var(--panel);
    border-radius: 0;
    overflow:hidden;
    user-select:none;
  }

  video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }

  .tap-zone{ position:absolute; top:0; bottom:0; width:40%; z-index:4; }
  .tap-zone.left{ left:0; }
  .tap-zone.right{ right:0; }

  .seek-flash{
    position:absolute; top:50%; transform: translateY(-50%) scale(0.85);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:#00000060; border-radius:50%; width:78px; height:78px; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .2s ease, transform .2s ease; z-index:6;
  }
  .seek-flash.left{ left: 8%; }
  .seek-flash.right{ right: 8%; }
  .seek-flash.show{ opacity:1; transform: translateY(-50%) scale(1); }
  .seek-flash svg{ width:22px; height:22px; fill:#fff; }
  .seek-flash span{ font-family:'Inter',sans-serif; font-size:11px; color:#fff; font-weight:600; }

  .center-play{
    position:absolute; top:50%; left:50%; transform: translate(-50%,-50%);
    width: 84px; height:84px; border-radius:50%; background: #e7e6eaee;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: transform .15s ease, opacity .2s ease; z-index:5;
  }
  .center-play:hover{ transform: translate(-50%,-50%) scale(1.05); }
  .center-play svg{ width:30px; height:30px; fill:#232228; margin-left:4px; }
  .player.playing .center-play{ opacity:0; pointer-events:none; }

  .controls{
    position:absolute; left:0; right:0; bottom:0;
    background: linear-gradient(180deg, transparent 0%, #000000b0 45%, #000000c8 100%);
    padding: 10px 16px 14px; display:flex; flex-direction:column; gap:8px; z-index:5;
    transition: opacity .2s ease;
  }
  .player.idle .controls { opacity:0; pointer-events:none; }

  .seek-wrap{ position:relative; height: 18px; display:flex; align-items:center; cursor:pointer; }
  .seek-track{ position:relative; width:100%; height:5px; background: var(--track); border-radius:3px; }
  .seek-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background: var(--fill); border-radius:3px; }
  .seek-handle{
    position:absolute; top:50%; left:0%; width:14px; height:14px;
    background: var(--fill); border-radius:50%; transform: translate(-50%,-50%);
    box-shadow: 0 1px 4px #00000060;
  }

  .controls-row{ display:flex; align-items:center; justify-content:space-between; }
  .cluster{ display:flex; align-items:center; gap: 16px; }

  .ctrl-btn{
    background:none; border:none; cursor:pointer; color: var(--icon);
    display:flex; align-items:center; justify-content:center; padding:2px;
    transition: color .15s ease, transform .15s ease;
  }
  .ctrl-btn:hover{ color:#fff; transform: scale(1.08); }
  .ctrl-btn svg{ width:19px; height:19px; fill:currentColor; }

  .volume-wrap{ position:relative; display:flex; align-items:center; }
  .vol-popup{
    position:absolute; bottom: 30px; left:50%; transform: translateX(-50%);
    background: rgba(28,27,32,0.85); backdrop-filter: blur(16px);
    border: 1px solid #ffffff1a; border-radius: 8px; padding: 12px 8px;
    display:none; flex-direction:column; align-items:center; box-shadow: 0 10px 24px #00000080;
  }
  .vol-popup.open{ display:flex; }
  .vol-vertical{ width:4px; height:70px; background: var(--track); border-radius:3px; position:relative; cursor:pointer; }
  .vol-vertical-fill{ position:absolute; left:0; right:0; bottom:0; height:70%; background: var(--fill); border-radius:3px; }
  .vol-vertical-handle{ position:absolute; left:50%; bottom:70%; width:11px; height:11px; background:var(--fill); border-radius:50%; transform: translate(-50%,50%); }
  .vol-pct{ font-family:'JetBrains Mono', monospace; font-size:10px; color: var(--icon-dim); margin-top:8px; }

  .settings-wrap{ position:relative; }
  .settings-menu{
    position:absolute; bottom: 32px; right:0; width: 200px;
    background: rgba(28,27,32,0.85); backdrop-filter: blur(16px);
    border: 1px solid #ffffff1a; border-radius: 10px; box-shadow: 0 14px 34px #00000090;
    overflow:hidden; display:none;
  }
  .settings-menu.open{ display:block; }
  .menu-header{ display:flex; align-items:center; gap:8px; padding: 11px 12px; font-size: 13px; font-weight:600; color:#fff; border-bottom: 1px solid #ffffff12; }
  .menu-row{ display:flex; align-items:center; justify-content:space-between; padding: 11px 12px; font-size: 13px; color: #e2e1e6; cursor:pointer; }
  .menu-panel{ display:none; }
  .menu-panel.active{ display:block; }

  .player.pseudo-fullscreen{ position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9999; }

  .ad-badge{
    position:absolute; top:14px; left:14px; background:#000000a8; color:#fff; font-size:11px; font-weight:600;
    padding:5px 10px; border-radius:5px; display:none; align-items:center; gap:6px; z-index:7;
  }
  .player.ad-playing .ad-badge{ display:flex; }
  .ad-badge .dot{ width:5px; height:5px; border-radius:50%; background:#ff5b5b; }

  .ad-skip-btn{
    position:absolute; bottom:64px; right:16px; background:#e7e6eaee; color:#232228; font-weight:600; font-size:12.5px;
    padding:8px 14px; border-radius:6px; cursor:pointer; display:none; align-items:center; gap:6px; z-index:7;
  }
  .ad-skip-btn.show{ display:flex; }
  .ad-skip-btn.waiting{ opacity:.55; cursor:default; }
</style>
</head>
<body>

<div class="stage">
  <div class="player idle" id="player">
    <video id="video" playsinline webkit-playsinline></video>

    <div class="tap-zone left" id="tapLeft"></div>
    <div class="tap-zone right" id="tapRight"></div>

    <div class="seek-flash left" id="flashLeft"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6zm.5-6 8.5 6V6z"/></svg><span>10 sec</span></div>
    <div class="seek-flash right" id="flashRight"><svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zm-1.5 6L3 6v12z"/></svg><span>10 sec</span></div>

    <div class="ad-badge" id="adBadge"><span class="dot"></span><span id="adLabel">Ad</span> · <span id="adCountdown">0:05</span></div>
    <div class="ad-skip-btn waiting" id="adSkipBtn">Skip Ad <span id="adSkipCountdown">5</span></div>

    <div class="center-play" id="centerPlay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>

    <div class="controls">
      <div class="seek-wrap" id="seekWrap">
        <div class="seek-track"><div class="seek-fill" id="seekFill"></div></div>
        <div class="seek-handle" id="seekHandle"></div>
      </div>

      <div class="controls-row">
        <div class="cluster">
          <button class="ctrl-btn" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M11.5 12 20 18V6zM4 12l8.5 6V6z"/></svg></button>
          <button class="ctrl-btn play-pause" id="playPause"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="ctrl-btn" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M12.5 12 4 6v12zM20 12l-8.5 6V6z"/></svg></button>

          <div class="volume-wrap">
            <button class="ctrl-btn" id="volBtn"><svg id="volIcon" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.48 4.48 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
            <div class="vol-popup" id="volPopup">
              <div class="vol-vertical" id="volVertical"><div class="vol-vertical-fill" id="volVerticalFill"></div><div class="vol-vertical-handle" id="volVerticalHandle"></div></div>
              <div class="vol-pct" id="volPct">70%</div>
            </div>
          </div>
        </div>

        <div class="cluster">
          <button class="ctrl-btn" id="fullscreenBtn"><svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const POSTER = params.get('poster') || '';
  const SRC = params.get('src') || '';
  const PREROLL_URL = params.get('preroll') || '';

  const player = document.getElementById('player');
  const video = document.getElementById('video');
  const centerPlay = document.getElementById('centerPlay');
  const playPause = document.getElementById('playPause');

  if (POSTER) video.poster = POSTER;
  if (SRC) { video.src = SRC; video.load(); }

  const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const pauseIcon = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

  function togglePlay(){
    if(adState === 'ad'){
      if(video.paused){ video.play(); player.classList.add('playing'); playPause.innerHTML = pauseIcon; centerPlay.innerHTML = pauseIcon; }
      else { video.pause(); player.classList.remove('playing'); playPause.innerHTML = playIcon; centerPlay.innerHTML = playIcon; }
      return;
    }
    if(!prerollDone && PREROLL_URL && video.paused){
      startAd({src: PREROLL_URL, skipAfter:5});
      return;
    }
    if(video.paused){
      video.play().catch(()=>{ video.muted = true; video.play(); });
      player.classList.add('playing'); playPause.innerHTML = pauseIcon; centerPlay.innerHTML = pauseIcon;
    } else {
      video.pause(); player.classList.remove('playing'); playPause.innerHTML = playIcon; centerPlay.innerHTML = playIcon;
    }
  }

  centerPlay.addEventListener('click', togglePlay);
  playPause.addEventListener('click', togglePlay);

  let adState = 'content';
  let prerollDone = !PREROLL_URL;

  function startAd(entry){
    adState = 'ad';
    player.classList.add('ad-playing');
    video.src = entry.src;
    video.play().catch(()=> endAd());
  }

  function endAd(){
    player.classList.remove('ad-playing');
    prerollDone = true;
    video.src = SRC;
    video.play().catch(()=>{});
    adState = 'content';
  }

  video.addEventListener('ended', ()=>{ if(adState === 'ad') endAd(); });
  video.addEventListener('error', ()=>{ if(adState === 'ad') endAd(); });
</script>
</body>
</html>
